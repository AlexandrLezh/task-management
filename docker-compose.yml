services:

  task-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task-service

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .secrets/app.env

    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy


  mongodb:
    image: mongo:7
    container_name: task-mongodb

    ports:
      - "27017:27017"

    env_file:
      - .secrets/mongodb.env

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: task-postgres

    env_file:
      - .secrets/postgres.env

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
  postgres-data:
